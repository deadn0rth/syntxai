[pytest]
testpaths = tests
addopts = -v --html=report.html --self-contained-html
markers =
    smoke: mark a test as smoke test
    full: mark a test as full test
    negative: mark tests that document invalid input handling
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
